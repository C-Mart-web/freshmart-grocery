<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupee Mart | Login</title>
<style>
:root{--g:#168447;--gd:#0f6b38;--mint:#eaf8ef;--bg:#f5faf6;--text:#183126;--muted:#718078;--line:#dfebe3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eaf8ef,#f8fbf8 55%,#e7f5eb);font-family:Arial,Helvetica,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:100%;max-width:440px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--g);font-size:24px;font-weight:850;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:15px;background:var(--g);color:white;display:grid;place-items:center;font-size:25px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:0 16px 50px #11663812}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--g)}h1{font-size:27px;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 23px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d9e7dd;border-radius:11px;font:inherit;outline:none}.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px #16844714}.passwordbox{display:flex;gap:8px}.passwordbox input{flex:1;min-width:0}.show{background:var(--mint);color:var(--gd);border:0;border-radius:10px;padding:0 12px;font-weight:700}.primary{width:100%;border:0;background:var(--g);color:white;padding:14px;border-radius:11px;font-size:15px;font-weight:800;margin-top:8px}.primary:disabled{opacity:.55}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}.row label{display:flex;align-items:center;gap:6px;color:var(--muted)}a{color:var(--g);font-weight:750;text-decoration:none}.message{display:none;padding:11px;border-radius:10px;font-size:13px;line-height:1.45;margin:14px 0}.message.error{display:block;background:#fff0f0;color:#a52828}.message.ok{display:block;background:#eaf8ef;color:#116638}.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}.preview{margin-top:15px;padding:11px;background:#fff8e7;color:#785913;border:1px solid #f1e0ad;border-radius:10px;font-size:11px;line-height:1.5}@media(max-width:420px){.card{padding:22px}.brand{font-size:22px}}
</style>
<style>.brandmark img,.brand .logo img{width:100%;height:100%;object-fit:contain;display:block}</style>
<style id="rupee-mart-login-animated-theme">
body{position:relative;isolation:isolate;overflow-x:hidden;background:linear-gradient(135deg,#e9f8ef 0%,#f8fcf8 48%,#e3f5e9 100%)}
.rm-login-ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.rm-login-ambient:before,.rm-login-ambient:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.65}
.rm-login-ambient:before{width:260px;height:260px;left:-95px;top:8%;background:radial-gradient(circle,#b8efca 0%,#dff7e7 58%,transparent 72%);animation:rmGlow 8s ease-in-out infinite alternate}
.rm-login-ambient:after{width:300px;height:300px;right:-125px;bottom:5%;background:radial-gradient(circle,#c6efd4 0%,#e5f7eb 58%,transparent 72%);animation:rmGlow 10s ease-in-out infinite alternate-reverse}
.rm-float{position:absolute;display:grid;place-items:center;border:1px solid #d8efdf;background:rgba(255,255,255,.78);box-shadow:0 12px 30px rgba(25,110,60,.09);border-radius:22px;backdrop-filter:blur(5px);animation:rmFloat 6s ease-in-out infinite}
.rm-float.cart{width:68px;height:68px;left:5%;top:17%;font-size:34px}
.rm-float.grocery{width:58px;height:58px;right:7%;top:29%;font-size:29px;animation-delay:-2s}
.rm-float.wallet{width:68px;height:68px;left:7%;bottom:13%;font-size:33px;animation-delay:-3.5s}
.rm-float.coins{width:54px;height:54px;right:8%;bottom:17%;font-size:27px;animation-delay:-1s}
.rm-flow{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;color:#168447;opacity:.23;font-size:22px;font-weight:800;white-space:nowrap}
.rm-flow span{animation:rmPulse 2.4s ease-in-out infinite}.rm-flow span:nth-child(2){animation-delay:.3s}.rm-flow span:nth-child(3){animation-delay:.6s}.rm-flow span:nth-child(4){animation-delay:.9s}
@keyframes rmFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-13px) rotate(3deg)}}
@keyframes rmGlow{from{transform:scale(.92);opacity:.45}to{transform:scale(1.08);opacity:.8}}
@keyframes rmPulse{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
.wrap{position:relative;z-index:1}.card{background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
@media(max-width:520px){body{padding:18px 14px}.rm-float.cart{left:2%;top:10%;width:48px;height:48px;font-size:25px}.rm-float.grocery{right:2%;top:23%;width:45px;height:45px;font-size:23px}.rm-float.wallet{left:2%;bottom:8%;width:48px;height:48px;font-size:24px}.rm-float.coins{right:2%;bottom:10%;width:44px;height:44px;font-size:21px}.rm-flow{top:53%;font-size:17px;gap:6px}}
@media(prefers-reduced-motion:reduce){.rm-float,.rm-flow span,.rm-login-ambient:before,.rm-login-ambient:after{animation:none!important}}
</style>

</head>
<body>
<div class="rm-login-ambient" aria-hidden="true"><div class="rm-float cart">🛒</div><div class="rm-float grocery">🥬</div><div class="rm-float wallet">👛</div><div class="rm-float coins">🪙</div><div class="rm-flow"><span>🛒</span><span>→</span><span>📦</span><span>→</span><span>💰</span></div></div>
<div class="wrap">
 <div class="brand"><div class="logo">🛒</div><span>Rupee Mart</span></div>
 <div class="card">
  <div class="eyebrow">Member access</div><h1>Welcome back</h1><p class="sub">Sign in to manage your groceries, membership and rewards.</p>
  <form id="loginForm">
   <div class="field"><label for="identity">Username or mobile number</label><input id="identity" name="identity" autocomplete="username" placeholder="Username or mobile number" required></div>
   <div class="field"><label for="password">Password</label><div class="passwordbox"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="show" type="button" id="toggle">Show</button></div></div>
   <div class="row"><label><input type="checkbox" id="remember"> Remember me on this device</label><a href="#" id="forgot">Forgot password?</a></div>
   <div id="message" class="message" role="status"></div>
   <button class="primary" type="submit" id="submit">Login securely</button>
  </form>
 </div>
 <div class="foot">New to Rupee Mart? <a href="register.html">Create an account</a><br><br>© Rupee Mart</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FM_SUPABASE_URL='https://wmquhgmrvdlcxmgarxqp.supabase.co';
const FM_PUBLISHABLE_KEY='sb_publishable_pHDkQK4EdDZY9Zct856puQ_FQPYFWPa';
const FM_AUTH_ENDPOINT=FM_SUPABASE_URL+'/functions/v1/clever-service';
const pw=document.getElementById('password'),msg=document.getElementById('message');
const identityInput=document.getElementById('identity');
const queryIdentity=new URLSearchParams(location.search).get('identity');if(queryIdentity)identityInput.value=queryIdentity;
document.getElementById('toggle').addEventListener('click',()=>{pw.type=pw.type==='password'?'text':'password';document.getElementById('toggle').textContent=pw.type==='password'?'Show':'Hide'});
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('submit');button.disabled=true;button.textContent='Signing in…';msg.className='message';msg.textContent='';
 try{
  const response=await fetch(FM_AUTH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':FM_PUBLISHABLE_KEY},body:JSON.stringify({action:'login',identity:identityInput.value.trim(),password:pw.value})});
  const result=await response.json().catch(()=>({error:'The server returned an unreadable response.'}));
  if(!response.ok||!result.success)throw new Error(result.error||'Login failed.');
  if(!window.supabase)throw new Error('Supabase client failed to load. Refresh the page and retry.');
  const client=window.supabase.createClient(FM_SUPABASE_URL,FM_PUBLISHABLE_KEY);
  const {error:setSessionError}=await client.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});
  if(setSessionError)throw setSessionError;
  msg.className='message ok';msg.textContent='Login successful. Opening your panel…';
  const role=String(result.profile.role||'').toLowerCase();
  setTimeout(()=>location.href=['super_admin','super admin','admin'].includes(role)?'admin.html':'user.html',500);
 }catch(err){msg.className='message error';msg.textContent=err.message||'Unable to sign in. Please retry.';}
 finally{button.disabled=false;button.textContent='Login securely';}
});
document.getElementById('forgot').addEventListener('click',async e=>{
 e.preventDefault();
 const email=prompt('Enter your registered email address to receive a password reset link:');
 if(!email) return;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())){msg.className='message error';msg.textContent='Please enter a valid registered email address.';return;}
 const link=document.getElementById('forgot');link.style.pointerEvents='none';link.textContent='Sending…';msg.className='message';msg.textContent='';
 try{
  if(!window.supabase) throw new Error('Supabase client failed to load. Refresh and retry.');
  const client=window.supabase.createClient(FM_SUPABASE_URL,FM_PUBLISHABLE_KEY);
  const redirectTo=new URL('reset-password.html',location.href).href;
  const {error}=await client.auth.resetPasswordForEmail(email.trim(),{redirectTo});
  if(error) throw error;
  msg.className='message ok';msg.textContent='If this email is registered, a password reset link has been sent. Check your inbox and spam folder.';
 }catch(err){msg.className='message error';msg.textContent=err.message||'Unable to send the reset email.';}
 finally{link.style.pointerEvents='';link.textContent='Forgot password?';}
});
</script>

<script>
/* Rupee Mart shared logo: reads the logo saved by Super Admin. */
(async function fmLoadSharedBrandLogo(){
  const SUPABASE_URL='https://wmquhgmrvdlcxmgarxqp.supabase.co';
  const SUPABASE_KEY='sb_publishable_pHDkQK4EdDZY9Zct856puQ_FQPYFWPa';
  try {
    const response = await fetch(SUPABASE_URL + '/rest/v1/fm_store_settings?select=setting_value&setting_key=eq.brand_logo&limit=1', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    });
    if (!response.ok) return;
    const rows = await response.json();
    const config = rows && rows[0] && rows[0].setting_value;
    if (!config || !config.image_url) return;
    const logoUrl = String(config.image_url);
    const logoNodes = document.querySelectorAll('.brandmark, .brand .logo, .brand .brandmark');
    logoNodes.forEach(function(node) {
      node.innerHTML = '';
      const img = document.createElement('img');
      img.src = logoUrl;
      img.alt = 'Rupee Mart';
      img.loading = 'eager';
      img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff;display:block';
      node.appendChild(img);
      node.style.background = '#fff';
      node.style.overflow = 'hidden';
      if (config.display_mode === 'image_only') {
        const brand = node.closest('.brand');
        if (brand) {
          Array.from(brand.children).forEach(function(child) {
            if (child !== node) child.style.display = 'none';
          });
        }
      }
    });
  } catch (e) {
    console.warn('Shared logo could not be loaded; default logo remains active.', e);
  }
})();
</script>
</body>
</html>
