<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh-Mart | Reset Password</title><style>
:root{--g:#168447;--text:#183126;--muted:#718078;--line:#dfebe3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eaf8ef,#f8fbf8 55%,#e7f5eb);font-family:Arial,Helvetica,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:100%;max-width:440px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--g);font-size:24px;font-weight:850;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:15px;background:var(--g);color:white;display:grid;place-items:center;font-size:25px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:0 16px 50px #11663812}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--g)}h1{font-size:27px;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 23px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d9e7dd;border-radius:11px;font:inherit}.primary{width:100%;border:0;background:var(--g);color:white;padding:14px;border-radius:11px;font-size:15px;font-weight:800;margin-top:8px}.primary:disabled{opacity:.55}.message{display:none;padding:11px;border-radius:10px;font-size:13px;line-height:1.45;margin:14px 0}.message.error{display:block;background:#fff0f0;color:#a52828}.message.ok{display:block;background:#eaf8ef;color:#116638}.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:20px}a{color:var(--g);font-weight:750;text-decoration:none}</style></head><body><div class="wrap"><div class="brand"><div class="logo">🛒</div><span>Fresh-Mart</span></div><div class="card"><div class="eyebrow">Account security</div><h1>Create a new password</h1><p class="sub">Enter your new password below. Use at least 8 characters.</p><form id="resetForm"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><div id="message" class="message" role="status"></div><button class="primary" id="save" type="submit">Update password</button></form></div><div class="foot"><a href="login.html">Back to Login</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://wmquhgmrvdlcxmgarxqp.supabase.co';const PUBLISHABLE_KEY='sb_publishable_pHDkQK4EdDZY9Zct856puQ_FQPYFWPa';const client=window.supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY);const form=document.getElementById('resetForm'),msg=document.getElementById('message'),btn=document.getElementById('save');
(async()=>{try{const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){msg.className='message error';msg.textContent='This reset link is invalid or expired. Return to Login and request a new link.';btn.disabled=true;}}catch(err){msg.className='message error';msg.textContent=err.message||'Unable to verify reset link.';btn.disabled=true;}})();
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<8){msg.className='message error';msg.textContent='Password must contain at least 8 characters.';return;}if(p!==c){msg.className='message error';msg.textContent='Passwords do not match.';return;}btn.disabled=true;btn.textContent='Updating…';try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;msg.className='message ok';msg.textContent='Password updated successfully. You can now sign in with your new password.';form.reset();setTimeout(()=>location.href='login.html',1800);}catch(err){msg.className='message error';msg.textContent=err.message||'Password update failed. Request a new reset link.';}finally{btn.disabled=false;btn.textContent='Update password';}});
</script></body></html>
